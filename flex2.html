<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="flex2.css">
    <title>Вирівнювання align-center</title>
</head>
<body>
    <h1>Stretch-контейнер</h1>
        <div class="flex-container stretch">
        <div class="item h-auto">1</div>
        <div class="item h-auto">2</div>
        <div class="item h-auto">3</div>
    </div>
    <h2>Притискаються одне до одного</h2>
        <div class="container flex-start">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>Притисаються до низу</h3>
        <div class="container flex-end">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h4>Рівняються по шрифту</h4>
        <div class="container h-150 baseline">
        <div class="item">1</div>12PX
        <div class="item">2</div>28PX
        <div class="item">3</div>56PX
    </div>
    
</body>
</html>
