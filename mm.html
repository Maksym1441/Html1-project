<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кольорова таблиця</title>
    <style>
        /* Загальні стилі таблиці */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        /* Стилізація шапки таблиці */
        thead tr {
            background-color: #2c3e50;
            color: #ffffff;
        }

        /* --- ВАРІАНТ 1: Зеброве забарвлення (парні/непарні рядки) --- */
        /* 
        tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }
        tbody tr:nth-child(even) {
            background-color: #edf2f7;
        }
        */

        /* --- ВАРІАНТ 2: Унікальний колір для кожного рядка окремо --- */
        tbody tr:nth-child(1) { background-color: #ebf8ff; /* Світло-блакитний */ }
        tbody tr:nth-child(2) { background-color: #f0fff4; /* Світло-зелений */ }
        tbody tr:nth-child(3) { background-color: #fffaf0; /* Світло-жовтий */ }
        tbody tr:nth-child(4) { background-color: #fff5f5; /* Світло-рожевий */ }

        /* Ефект при наведенні миші на рядок */
        tbody tr:hover {
            background-color: #e2e8f0;
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>

    <h2>Розклад / Список проєктів</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва проєкту</th>
                <th>Технологія</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td> Landing Page</td>
                <td>HTML5 / CSS3</td>
                <td>Завершено</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Гра 2048</td>
                <td>JavaScript</td>
                <td>В розробці</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Портфоліо</td>
                <td>UI/UX Design</td>
                <td>Планується</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Адмін-панель</td>
                <td>React</td>
                <td>В очікуванні</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
