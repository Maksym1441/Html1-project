<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cards.css">
    <title>Cards</title>
</head>
<body>
    <h1>Картки та макети</h1>
        <h2>Картка</h2>
        <p>
            Картка (card) - один з центральних
            термінів який часто вживається для представлення
             різноманітних товарів: фільмів, ігор,товарів,тощо
        </p>
        <div class=card>
            <div class="card-image"></div>
            <div class="card-headline">Headline</div>
            <div class="card-subhead">Subhead</div>
            <div class="card-text">
            Самий кращий вибір тільки для вас. 
            Поспішайте придбати. 
        </div>
        <div class="card-footer">
        <div class="card-button">Купити</div>
        <div class="card-button">Кошик</div>
        </div>
        </div>
</body>
</html>
